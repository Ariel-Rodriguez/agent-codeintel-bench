# Isolation model
#
#   bench-net (internal)   gateway                 default bridge
#   ────────────────────   ───────                 ──────────────
#   bench  ──only──> gateway ──only model host──>  internet
#
# * `bench` is attached ONLY to `bench-net`, an internal network with no route
#   off the host. It cannot reach the internet directly.
# * `gateway` is the one allowlisted egress path: it forwards to a single
#   UPSTREAM_BASE_URL. A malicious extension can talk to the model and nothing
#   else, so it cannot exfiltrate to arbitrary hosts.
# * `probe` has `network_mode: none` — zero network, used for the malicious
#   behaviour check.
#
# Teardown: docker/run.sh down   (containers and anonymous volumes are removed)
networks:
  bench-net:
    internal: true

services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: agent-codeintel-bench
    entrypoint: ["python3", "/bench/docker/gateway.py"]
    networks:
      - bench-net
    environment:
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-}
      GATEWAY_PORT: "8080"
    restart: unless-stopped

  bench:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${BENCH_IMAGE:-agent-codeintel-bench}
    init: true
    depends_on:
      - gateway
    networks:
      - bench-net
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /bench/work:size=512m
      - /bench/results:size=256m
      - /bench/configs:size=64m
      - /home/runner:size=128m
    volumes:
      # Only the results directory and the (optional) auth file are mounted.
      # The corpus, the single task prompt, and the tool come from per-run mounts
      # added by harness/run_isolated.sh. References are never mounted.
      - ../out:/out
      - ${PI_AUTH_DIR:-../.no-auth}:/auth:ro
    environment:
      PI_USER_AGENT_DIR: /auth
      PI_PROVIDER: ${PI_PROVIDER:-deepseek}
      PI_MODEL: ${PI_MODEL:-deepseek-flash}
      PI_THINKING: ${PI_THINKING:-high}
      ENHANCED_TOOLS: ${ENHANCED_TOOLS:-read,bash,edit,write}
      CODEINTEL_EXT: ${CODEINTEL_EXT:-}
      RUN_ID: ${RUN_ID:-run1}
      TOOL_PATH: ${TOOL_PATH:-}
      # All model traffic goes through the gateway, never direct.
      MODEL_GATEWAY: http://gateway:8080/v1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  probe:
    image: ${BENCH_IMAGE:-agent-codeintel-bench}
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /home/runner:size=64m
    volumes:
      - ../inputs:/inputs:ro
    command: ["probe"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
