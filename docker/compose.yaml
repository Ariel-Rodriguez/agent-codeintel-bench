# Isolated A/B runner. Nothing from the host is exposed except inputs/ (read-only)
# and out/ (results). The container root filesystem is read-only; work/, results/,
# configs/ and the home directory are ephemeral tmpfs, so teardown leaves no trace.
services:
  bench:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: agent-codeintel-bench
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /bench/work:size=512m
      - /bench/results:size=256m
      - /bench/configs:size=64m
      - /home/runner:size=128m
    volumes:
      - ../inputs:/inputs:ro
      - ../out:/bench/out
      # Optional: mount a directory containing auth.json read-only. It is then
      # readable by the untrusted extension (that is the tradeoff for giving the
      # agent model access). Prefer a scoped, short-lived key.
      - ${PI_AUTH_DIR:-../.no-auth}:/auth:ro
    environment:
      PI_USER_AGENT_DIR: /auth
      PI_PROVIDER: ${PI_PROVIDER:-deepseek}
      PI_MODEL: ${PI_MODEL:-deepseek-flash}
      PI_THINKING: ${PI_THINKING:-high}
      ENHANCED_TOOLS: ${ENHANCED_TOOLS:-read,bash,edit,write}
      CODEINTEL_EXT: ${CODEINTEL_EXT:-}
      RUN_ID: ${RUN_ID:-run1}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Network is needed for the model API. To further restrict egress, put the
    # model behind a proxy and set an internal network, or override this service
    # with a network that only reaches the provider.
